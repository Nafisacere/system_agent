<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Agent — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #21262d;
      --text:    #c9d1d9;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --danger:  #f85149;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-bottom: 36px;
    }
    .logo-dot {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #e8003d, #ff5b7d);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff;
    }
    .logo-text h1 { font-size: 1.3rem; font-weight: 700; }
    .logo-text p  { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.88rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }
    .field input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #e8003d;
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity .15s;
      font-family: inherit;
    }
    .btn:hover  { opacity: 0.88; }
    .btn:active { opacity: 0.75; }

    .error-msg {
      background: rgba(248,81,73,0.08);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      display: none;
    }

    footer {
      text-align: center;
      font-size: 0.72rem;
      color: #444d56;
      margin-top: 24px;
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="logo">
    <div class="logo-dot">O</div>
    <div class="logo-text">
      <h1>System Agent</h1>
      <p>Monitoring Dashboard</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Sign in</div>
    <div class="card-sub">Enter your credentials to continue</div>

    <div class="error-msg" id="error-msg">Incorrect username or password</div>

    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="Username" autocomplete="username" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
    </div>

    <button class="btn" onclick="login()">Sign in</button>
  </div>

  <footer>System Agent v2.0</footer>

</div>

<script>
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') login();
  });

  // auto focus username
  document.getElementById('username').focus();

  function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorMsg = document.getElementById('error-msg');

    if (username === 'admin' && password === 'admin123') {
      sessionStorage.setItem('sa_auth', 'true');
      window.location.href = '/';
    } else {
      errorMsg.style.display = 'block';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }
</script>
</body>
</html>
